required_metrics:
  # API readiness
  - jobskill_api_ready
  - jobskill_api_database_ready
  - jobskill_api_promoted_model_ready
  - jobskill_api_promoted_model_file_exists
  - jobskill_training_duration_seconds
  - jobskill_training_duration_threshold_seconds
  - jobskill_training_rows
  - jobskill_training_category_count
  - jobskill_training_throughput_rows_per_second
  - jobskill_training_model_size_bytes
  - jobskill_training_incremental_experiment_by_duration

  # Model prediction metrics
  - jobskill_model_predictions_total
  - jobskill_model_prediction_avg_confidence
  - jobskill_model_prediction_low_confidence_ratio

  # API request metrics
  - jobskill_api_prediction_requests_total
  - jobskill_api_prediction_avg_latency_ms

  # Pipeline check metrics
  - jobskill_pipeline_check_results_total
  - jobskill_pipeline_recent_failed_checks_total

  # Model registry metrics
  - jobskill_model_registry_records_total
  - jobskill_latest_promoted_model_accuracy
  - jobskill_latest_promoted_model_f1_weighted

  # Alert event metrics
  - jobskill_alert_events_total
  - jobskill_alert_current_states_total

  # Alert response metrics
  - jobskill_alert_acknowledgements_total
  - jobskill_alert_avg_mtta_minutes
  - jobskill_alert_avg_mttr_minutes
  - jobskill_alert_unacknowledged_current_total

  # Alert control metrics
  - jobskill_alert_maintenance_mode

  # Production feedback metrics
  - jobskill_production_feedback_total
  - jobskill_production_feedback_accuracy
  - jobskill_production_feedback_f1_weighted
  - jobskill_production_feedback_category_total

  # Retraining candidate metrics
  - jobskill_retraining_candidate_flag
  - jobskill_retraining_candidate_feedback_count
  - jobskill_retraining_candidate_accuracy
  - jobskill_retraining_candidate_f1_weighted
  - jobskill_retraining_candidate_accuracy_delta
  - jobskill_retraining_candidate_f1_delta

external_metrics:
  alertmanager:
    url: http://localhost:9093/metrics
    required_metrics:
      - alertmanager_notifications_failed_total